<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="javascript/generation_mots.js"></script>
    <title>Projet HTML</title>
</head>
<body>
    <div id="affichage_points">
        <p id="points">Points : 0</p>
    </div>
    <div id="affichage_mots">
        <p>Apparition des mots</p>
        <p id="liste_mots"></p>
    </div>
    <input id="mot" type="text" placeholder="test">
    <div>
        <p>Temps d'apparition en secondes :</p>
        <p>1</p><input type="range"  id="duree" min="1" max="10" value="2"><p>10</p>
    </div>

    <input id="longueur" type="text" placeholder="8" value="12">
    <button id="acceleration">Accélerer</button>
</body>
</html>
