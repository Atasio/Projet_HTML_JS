<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Word Rain - Typing Game - Menu</title>
</head>
<body>
    <div id="game-container">
        <!-- Background particles -->
        <canvas id="particles"></canvas>
        
        <!-- Main Menu Content -->
        <div id="menu-content">
            <!-- Game Title -->
            <h1 id="game-title">
                <span class="title-word">Word</span>
                <span class="title-rain">Rain</span>
            </h1>
            <p id="game-subtitle">Typing Game</p>
            
            <!-- Menu Buttons -->
            <div id="menu-buttons">
                <button id="solo-btn" class="menu-btn">
                    <span class="btn-icon">🎮</span>
                    <span class="btn-text">Solo</span>
                    <span class="btn-description">Jouez seul contre le chrono</span>
                </button>
                
                <button id="create-room-btn" class="menu-btn">
                    <span class="btn-icon">✨</span>
                    <span class="btn-text">Create Room</span>
                    <span class="btn-description">Créez une partie multijoueur</span>
                </button>
                
                <button id="join-room-btn" class="menu-btn">
                    <span class="btn-icon">🚪</span>
                    <span class="btn-text">Join Room</span>
                    <span class="btn-description">Rejoignez une partie existante</span>
                </button>
            </div>
        </div>
    </div>

    <script src="javascript/menu.js"></script>
</body>
</html>
