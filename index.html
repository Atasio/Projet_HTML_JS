<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Word Rain - Typing Game - Menu</title>
</head>
<body>
    <div id="game-container">
        <!-- Background particles -->
        <canvas id="particles"></canvas>
        
        <!-- Panneau de paramètres (gauche) -->
        <div id="settings-panel">
            <button id="toggle-settings" class="control-btn">⚙️</button>
            <div id="settings-content" class="hidden">
                <h3 class="settings-title">Paramètres</h3>
                <div class="control-group">
                    <label>Vitesse de chute</label>
                    <div class="slider-container">
                        <span>Lent</span>
                        <input type="range" id="speed" min="1" max="10" value="5">
                        <span>Rapide</span>
                    </div>
                    <div class="value-display">Valeur: <span id="speed-value">5</span></div>
                </div>
                <div class="control-group">
                    <label>Longueur max des mots</label>
                    <div class="slider-container">
                        <span>4</span>
                        <input type="range" id="max-length" min="4" max="15" value="12">
                        <span>15</span>
                    </div>
                    <div class="value-display">Valeur: <span id="max-length-value">12</span></div>
                </div>
                <div class="control-group">
                    <label>Fréquence d'apparition</label>
                    <div class="slider-container">
                        <span>1s</span>
                        <input type="range" id="spawn-rate" min="1" max="5" value="2" step="0.5">
                        <span>5s</span>
                    </div>
                    <div class="value-display">Valeur: <span id="spawn-rate-value">2</span>s</div>
                </div>
                <button id="reset-settings-btn" class="control-btn-secondary">🔄 Réinitialiser</button>
            </div>
        </div>
        
        <!-- Leaderboard (droite) -->
        <div id="leaderboard">
            <h2 class="leaderboard-title">🏆 Leaderboard</h2>
            <div id="leaderboard-list">
                <!-- Sera rempli dynamiquement -->
            </div>
        </div>
        
        <!-- Main Menu Content -->
        <div id="menu-content">
            <!-- Game Title -->
            <h1 id="game-title">
                <span class="title-word">Word</span>
                <span class="title-rain">Rain</span>
            </h1>
            <p id="game-subtitle">Typing Game</p>
            
            <!-- Menu Buttons -->
            <div id="menu-buttons">
                <button id="solo-btn" class="menu-btn">
                    <span class="btn-icon">🎮</span>
                    <span class="btn-text">Solo</span>
                    <span class="btn-description">Jouez seul contre le chrono</span>
                </button>
                
                <button id="create-room-btn" class="menu-btn">
                    <span class="btn-icon">✨</span>
                    <span class="btn-text">Create Room</span>
                    <span class="btn-description">Créez une partie multijoueur</span>
                </button>
                
                <button id="join-room-btn" class="menu-btn">
                    <span class="btn-icon">🚪</span>
                    <span class="btn-text">Join Room</span>
                    <span class="btn-description">Rejoignez une partie existante</span>
                </button>
            </div>
        </div>
    </div>

    <script src="javascript/settings.js" type="module"></script>
    <script src="javascript/leaderboard.js" type="module"></script>
    <script src="javascript/menu.js"></script>
</body>
</html>
